<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BAR POS - MOOSETown</title>
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTU9PU0VUb3duIEJBUiBQT1MiLCJzaG9ydF9uYW1lIjoiQkFSIFBPUyIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMGYxMTE1IiwidGhlbWVfY29sb3IiOiIjMjJjNTVlIiwiaWNvbnMiOlt7InNyYyI6Imh0dHBzOi8vY2RuLWljb25zLXBuZy5mbGF0aWNvbi5jb20vNTEyLzEwMjkvMTAyOTM5MjIucG5nIiwic2l6ZXMiOiI1MTJ4NTEyIiwidHlwZSI6ImltYWdlL3BuZyJ9XX0=">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background:#0a0c10;color:#fff}
.header{background:#000;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #f59e0b;position:sticky;top:0;z-index:100}
.logo{font-weight:900;font-size:18px}.logo span{color:#f59e0b}
.install-btn{background:#22c55e;color:#000;font-weight:900;padding:7px 14px;border-radius:20px;font-size:12px;border:none;cursor:pointer}
.section{margin:14px 12px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:10px 14px;border-radius:12px;font-weight:900;letter-spacing:1px}
.sec-head.beers{background:linear-gradient(90deg,#16a34a,#15803d)}
.sec-head.ciders{background:linear-gradient(90deg,#f59e0b,#d97706);color:#000}
.sec-head.clear{background:linear-gradient(90deg,#06b6d4,#0891b2);color:#000}
.sec-head.whiskey{background:linear-gradient(90deg,#78350f,#451a03)}
.sec-head.brandy{background:linear-gradient(90deg,#7c2d12,#431407)}
.sec-head.food{background:linear-gradient(90deg,#be185d,#9d174d)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(5,1fr)}}
.p-card{background:#1a202c;border-radius:16px;padding:12px;border:2px solid #2d3748;cursor:pointer;position:relative}
.p-card:active{transform:scale(.94);border-color:#22c55e}
.p-icon{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px}
.p-name{font-weight:900;font-size:13px;margin-top:8px;min-height:28px;line-height:1.1}
.p-price{font-weight:900;color:#22c55e;font-size:17px;margin-top:4px}
.p-cat{font-size:9px;color:#6b7280;font-weight:800;margin-top:2px;letter-spacing:.5px}
.add{position:absolute;top:8px;right:8px;width:26px;height:26px;background:#22c55e;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
.cart{position:fixed;bottom:0;left:0;right:0;background:#141821;border-top:3px solid #22c55e;max-height:55vh;display:flex;flex-direction:column;z-index:90}
@media(min-width:1100px){.cart{left:auto;width:380px;top:58px;bottom:0;max-height:none;border-left:3px solid #22c55e;border-top:none}}
.cart-top{padding:12px 14px;background:#1a202c;display:flex;justify-content:space-between;font-weight:900;border-bottom:2px solid #222}
.items{overflow:auto;padding:10px;flex:1}
.row{display:flex;justify-content:space-between;background:#1a202c;border:1px solid #2d3748;border-radius:10px;padding:8px 10px;margin-bottom:6px}
.totals{padding:12px 14px;background:#000;border-top:2px dashed #2d3748}
.t{display:flex;justify-content:space-between;margin:4px 0;font-weight:800;color:#9ca3af}.t.big{color:#fff;font-size:20px}.t.big span:last-child{color:#22c55e}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px}
.pay button{padding:13px;border-radius:12px;font-weight:900;border:none;cursor:pointer}
.cash{background:#22c55e}.card{background:#3b82f6;color:#fff}.print{background:#f59e0b}.clear{background:#1f2937;color:#fff;border:1px solid #374151}
.spacer{height:380px}@media(min-width:1100px){.spacer{display:none}.main-wrap{margin-right:380px}}
</style>
</head>
<body>
<div class="header">
  <div class="logo">🔥 MOOSETown <span>BAR POS</span></div>
  <button class="install-btn" onclick="alert('To install as APP:\n\nOn Tablet/Chrome:\n1. Click 3 dots ⋮ top right\n2. Click Install App / Add to Home Screen\n3. It will become like real App!\n\nYou can then sell tablets with it pre-installed!')">📲 INSTALL AS APP</button>
</div>

<div class="main-wrap">
  <div class="section" id="sec-beers"></div>
  <div class="section" id="sec-ciders"></div>
  <div class="section" id="sec-clear"></div>
  <div class="section" id="sec-whiskey"></div>
  <div class="section" id="sec-brandy"></div>
  <div class="section" id="sec-food"></div>
  <div class="spacer"></div>
</div>

<div class="cart">
  <div class="cart-top"><span>🧾 SALE <span id="cnt" style="color:#22c55e">(0)</span> <span id="today" style="font-size:11px;color:#9ca3af;margin-left:8px"></span></span><span onclick="cart=[];render()" style="background:#2d3748;padding:4px 10px;border-radius:8px;font-size:12px;cursor:pointer">Clear</span></div>
  <div class="items" id="cartItems"><div style="text-align:center;color:#6b7280;padding:20px;font-weight:800">Tap products above to add 👆<br><br>System shows nice tables for each category</div></div>
  <div class="totals"><div class="t"><span>Subtotal</span><span id="sub">R0.00</span></div><div class="t"><span>VAT 15%</span><span id="vat">R0.00</span></div><div class="t big"><span>TOTAL</span><span id="total">R0.00</span></div></div>
  <div class="pay"><button class="cash" onclick="pay('CASH')">💵 CASH</button><button class="card" onclick="pay('CARD')">💳 CARD</button><button class="print" onclick="printR()">🖨️ PRINT</button><button class="clear" onclick="hold()">📋 HOLD TAB</button></div>
</div>

<script>
const PRODUCTS = [
  // BEERS TABLE
  {name:"Castle Light",price:28,cat:"BEERS",sub:"BEERS",icon:"🍺",color:"#16a34a",text:"#fff"},
  {name:"Black Label",price:30,cat:"BEERS",sub:"BEERS",icon:"🍻",color:"#000",text:"#fbbf24"},
  {name:"Castle Lager",price:28,cat:"BEERS",sub:"BEERS",icon:"🍺",color:"#166534",text:"#fff"},
  {name:"Amstel",price:28,cat:"BEERS",sub:"BEERS",icon:"🍺",color:"#dc2626",text:"#fff"},
  {name:"Heineken",price:35,cat:"BEERS",sub:"BEERS",icon:"🍺",color:"#15803d",text:"#fff"},
  {name:"Corona",price:38,cat:"BEERS",sub:"BEERS",icon:"🍺",color:"#e0f2fe",text:"#000"},
  {name:"Windhoek",price:32,cat:"BEERS",sub:"BEERS",icon:"🍺",color:"#1d4ed8",text:"#fff"},
  {name:"Stella",price:36,cat:"BEERS",sub:"BEERS",icon:"🍺",color:"#b45309",text:"#fff"},
  // CIDERS BAR
  {name:"Savanna Dry",price:32,cat:"CIDERS",sub:"CIDERS",icon:"🍾",color:"#fef3c7",text:"#000"},
  {name:"Hunters Dry",price:30,cat:"CIDERS",sub:"CIDERS",icon:"🍏",color:"#facc15",text:"#000"},
  {name:"Brutal Fruit",price:28,cat:"CIDERS",sub:"CIDERS",icon:"🍓",color:"#ec4899",text:"#fff"},
  {name:"Bernini",price:30,cat:"CIDERS",sub:"CIDERS",icon:"🍷",color:"#a855f7",text:"#fff"},
  {name:"Smirnoff Spin",price:30,cat:"CIDERS",sub:"CIDERS",icon:"🍹",color:"#06b6d4",text:"#000"},
  // CLEAR SPIRITS - Bottles
  {name:"Smirnoff Vodka",price:40,cat:"SPIRITS",sub:"CLEAR SPIRITS",icon:"🍸",color:"#e0f2fe",text:"#000"},
  {name:"Gordon's Gin",price:38,cat:"SPIRITS",sub:"CLEAR SPIRITS",icon:"🍸",color:"#a7f3d0",text:"#000"},
  {name:"Bacardi White",price:45,cat:"SPIRITS",sub:"CLEAR SPIRITS",icon:"🥃",color:"#f0f9ff",text:"#000"},
  // WHISKEY
  {name:"Jack Daniels",price:45,cat:"SPIRITS",sub:"WHISKEY",icon:"🥃",color:"#292524",text:"#fbbf24"},
  {name:"Jameson",price:42,cat:"SPIRITS",sub:"WHISKEY",icon:"🥃",color:"#166534",text:"#fff"},
  {name:"Johnnie Walker",price:50,cat:"SPIRITS",sub:"WHISKEY",icon:"🥃",color:"#000",text:"#fbbf24"},
  {name:"Bells",price:35,cat:"SPIRITS",sub:"WHISKEY",icon:"🥃",color:"#f59e0b",text:"#000"},
  // BRANDY
  {name:"Klipdrift",price:38,cat:"SPIRITS",sub:"BRANDY",icon:"🥃",color:"#7c2d12",text:"#fff"},
  {name:"Hennessy",price:85,cat:"SPIRITS",sub:"BRANDY",icon:"🥃",color:"#431407",text:"#fbbf24"},
  {name:"Richelieu",price:40,cat:"SPIRITS",sub:"BRANDY",icon:"🥃",color:"#78350f",text:"#fff"},
  // FOOD
  {name:"Chisanyama Plate",price:85,cat:"FOOD",sub:"FOOD",icon:"🍖",color:"#f59e0b",text:"#000"},
  {name:"Pap & Wors",price:65,cat:"FOOD",sub:"FOOD",icon:"🍛",color:"#78350f",text:"#fff"},
];

let cart=[]; let sales=parseFloat(localStorage.getItem('sales')||0);

function init(){
  document.getElementById('today').textContent=`TODAY: R${sales.toFixed(0)}`;
  renderSections();
}

function renderSections(){
  const groups = {
    "BEERS":{id:"sec-beers",title:"🍺 BEERS TABLE - All Beers",class:"beers"},
    "CIDERS":{id:"sec-ciders",title:"🍏 CIDERS BAR - All Ciders",class:"ciders"},
    "CLEAR SPIRITS":{id:"sec-clear",title:"🍸 CLEAR SPIRITS - Vodka, Gin",class:"clear"},
    "WHISKEY":{id:"sec-whiskey",title:"🥃 WHISKEY - Jack, Jameson, Bells",class:"whiskey"},
    "BRANDY":{id:"sec-brandy",title:"🥃 BRANDY - Klipdrift, Hennessy",class:"brandy"},
    "FOOD":{id:"sec-food",title:"🍖 FOOD - Chisanyama",class:"food"},
  };
  Object.keys(groups).forEach(k=>{
    let g=groups[k];
    let list=PRODUCTS.filter(p=>p.sub===k);
    if(list.length===0) return;
    document.getElementById(g.id).innerHTML=`
      <div class="sec-head ${g.class}"><span>${g.title}</span><span style="font-size:11px;opacity:.8">${list.length} items</span></div>
      <div class="grid">${list.map((p,i)=>`
        <div class="p-card" onclick="add('${p.name}')">
          <div style="display:flex;justify-content:space-between"><div class="p-icon" style="background:${p.color};color:${p.text}">${p.icon}</div><div class="add">+</div></div>
          <div class="p-name">${p.name}</div>
          <div class="p-price">R${p.price.toFixed(2)}</div>
          <div class="p-cat">${p.sub}</div>
        </div>
      `).join('')}</div>
    `;
  });
}

function add(name){
  let p=PRODUCTS.find(x=>x.name===name);
  let f=cart.find(c=>c.name===name);
  if(f) f.qty++; else cart.push({name:p.name,price:p.price,qty:1});
  if(navigator.vibrate) navigator.vibrate(30);
  render();
}
function render(){
  let el=document.getElementById('cartItems');
  if(cart.length===0) el.innerHTML=`<div style="text-align:center;color:#6b7280;padding:20px;font-weight:800">Tap products above 👆</div>`;
  else el.innerHTML=cart.map((c,i)=>`<div class="row"><div><div style="font-weight:900;font-size:13px">${c.name}</div><div style="font-size:11px;color:#9ca3af">R${c.price} x ${c.qty} = R${(c.price*c.qty).toFixed(2)}</div></div><div style="display:flex;gap:6px"><div onclick="cart[${i}].qty--;if(cart[${i}].qty<=0)cart.splice(${i},1);render()" style="width:28px;height:28px;background:#2d3748;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer">-</div><div style="min-width:16px;text-align:center;font-weight:900">${c.qty}</div><div onclick="cart[${i}].qty++;render()" style="width:28px;height:28px;background:#2d3748;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer">+</div></div></div>`).join('');
  let sub=cart.reduce((s,c)=>s+c.price*c.qty,0); let vat=sub*0.15; let tot=sub+vat;
  document.getElementById('sub').textContent=`R${sub.toFixed(2)}`;
  document.getElementById('vat').textContent=`R${vat.toFixed(2)}`;
  document.getElementById('total').textContent=`R${tot.toFixed(2)}`;
  document.getElementById('cnt').textContent=`(${cart.reduce((a,b)=>a+b.qty,0)})`;
}
function pay(m){
  if(cart.length===0){alert("Add items first!");return;}
  let tot=document.getElementById('total').textContent;
  sales+=parseFloat(tot.replace('R','')); localStorage.setItem('sales',sales);
  document.getElementById('today').textContent=`TODAY: R${sales.toFixed(0)}`;
  alert(`✅ PAID ${m} - ${tot}`);
  printR(true); cart=[]; render();
}
function printR(auto=false){
  if(cart.length===0&&!auto){alert("No sale");return;}
  let items=cart.length?cart:[{name:"Sale",price:0,qty:1}];
  let sub=items.reduce((s,c)=>s+c.price*c.qty,0); let tot=sub*1.15;
  let w=window.open('','','width=320,height=600'); w.document.write(`<html><head><style>body{font-family:monospace;width:280px;padding:10px}h2{text-align:center}.c{text-align:center;font-size:12px}.row{display:flex;justify-content:space-between;font-size:13px;margin:4px 0}.line{border-top:1px dashed #000;margin:8px 0}</style></head><body><h2>🔥 MOOSETown CHISANYAMA</h2><div class="c">${new Date().toLocaleString()}</div><div class="line"></div>${items.map(c=>`<div class="row"><span>${c.name} x${c.qty}</span><span>R${(c.price*c.qty).toFixed(2)}</span></div>`).join('')}<div class="line"></div><div class="row" style="font-weight:900"><span>TOTAL</span><span>R${tot.toFixed(2)}</span></div></body></html>`); w.document.close(); w.print();
}
function hold(){ if(cart.length===0){alert("Cart empty");return;} alert("Tab held! Coming soon - will save table name"); }
init();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('data:text/javascript;base64,'+btoa('self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))})')); }
</script>
</body>
</html>
